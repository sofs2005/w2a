services:
  wb2api:
    # 已发布镜像（master 推送后由 .github/workflows/docker.yml 自动构建推送）
    image: ghcr.io/sofs2005/workbuddy2api:latest
    # 保留 build 段：想从源码本地构建时用 docker compose up -d --build
    build: .
    container_name: workbuddy2api
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
      # ── 内置面板（workbuddy2api-gui）────────────────────────────────
      # 面板与网关同进程、同端口，浏览器访问 http://<地址>:7863 即可打开。
      #
      # ⚠️ 面板持有全部账号凭据（accessToken / refreshToken），且与 API 同端口暴露。
      #    不设置口令时面板以默认的 admin/workbuddy 启动 —— 等于把账号控制权公开。
      #    这里用 `${WBGUI_PASSWORD:?...}` 强制要求：未设置则 compose 直接报错退出，
      #    而不是带着弱口令静默起来。
      #
      # 用法：在 .env 文件里写一行（或 export 后再 up）：
      #   WBGUI_PASSWORD=你的强口令
      #
      # 其他可选变量：
      # - WBGUI_USERNAME=admin              # 登录用户名
      # - WBGUI_SESSION_TTL=12h             # 会话有效期
      # - WBGUI_READ_ONLY=false             # true = 面板全局只读（仅监控场景）
      # - WBGUI_DANGEROUS_OPS=false         # true = 解锁删除账号等高危操作
      - WBGUI_PASSWORD=${WBGUI_PASSWORD:?请在 .env 中设置 WBGUI_PASSWORD（面板登录口令）}
    ports:
      - "7863:7863"
    volumes:
      # auths 凭证卷：login.sh 在宿主机落盘 workbuddy-<uid>.json（0600），容器网关以
      # app(uid 10001) 读 + 回写（refresh / realm backfill 走 tmp+rename，需目录写权限）。
      # 跨 uid 部署（非 root 宿主落盘 / rootful 下宿主 uid≠10001）读不到 → 账号数为 0
      # （issue #108）。登录后把目录属主交给 10001（与 ./data 卷同口径）：
      #   chown -R 10001:10001 ./auths
      # 面板扫码添加的账号由网关进程自身落盘（同 uid），无需额外 chown。
      - ./auths:/app/auths
      # data 保持 bind mount（本地映射，与旧版本一致）。
      # 若容器内 app(uid 10001) 写 state.json 报 permission denied，宿主机执行：
      #   chown -R 10001:10001 ./data
      # 面板的配置备份与登录凭据也落在这里（data/backups、data/gui-credentials.json）。
      - ./data:/app/data
      # 网关配置：挂**目录**而非单文件。
      # 为什么不是 ./config.json:/app/config.json：容器首启时该文件可能还不存在，
      # 单文件挂载会被 Docker 当目录自动创建（进而让网关把配置写成目录、启动失败）。
      # 挂目录后 ENTRYPOINT 读的是 /app/config/config.json：该文件不存在时网关
      # 自动生成一份随机 api_key 的配置（0600），落在宿主机 ./config/config.json，
      # 即开即用。需要在线编辑就改这个文件（面板「网关配置」页写的也是它）。
      - ./config:/app/config
