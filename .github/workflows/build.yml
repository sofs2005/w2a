# build.yml 多架构打包发布 ghcr.io + amd64 离线 tar.gz artifact。
# 解决 issue #21「建议打包现成 docker 镜像」：NAS/离线环境拉不到 ghcr 时用 artifact。
# 参考 /tmp/wb2api-build，适配本仓库（workflow 就住在仓库里，无需双 checkout 覆盖 Dockerfile）。
#
# 触发：打 v* tag 发布，或手动 workflow_dispatch 补跑。
# 原每日 cron 定时发布已于 2026-10-03 移除（master 推送由 docker.yml 负责构建，
# 定时只会重复发布同一份代码）；如需临时跑一次，用 workflow_dispatch。
name: Build & Publish

on:
  workflow_dispatch:
  push:
    tags: ['v*'] # 打 tag 触发发布

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Create config.json for build
        run: cp config.example.json config.json

      # setup-qemu 必须在 setup-buildx 之前：buildx 多架构依赖 QEMU 跨平台模拟。
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ghcr 镜像名必须全小写：github.repository 可能含大写，需转小写
      - name: Compute image name (lowercase)
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build & push multi-arch
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 额外导出 amd64 离线 tar.gz：NAS 拉不到 ghcr 时用 artifact 部署。
      - name: Export offline tarball (amd64)
        run: |
          docker buildx build --platform linux/amd64 --file Dockerfile \
            --tag wb2api:offline --output type=docker,dest=wb2api-amd64.tar .
          gzip -f wb2api-amd64.tar

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wb2api-amd64
          path: wb2api-amd64.tar.gz
          if-no-files-found: error
